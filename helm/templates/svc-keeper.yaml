---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  publishNotReadyAddresses: True
  ports:
  - port: {{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default 2181 }}
    targetPort: tcp-connect
    protocol: TCP
    name: tcp-connect
  {{- if .Values.clickhouse.configmap.clickhouseKeeper.metrics.enabled }}
  - port: {{ .Values.clickhouse.configmap.clickhouseKeeper.metrics.port | default 9141 }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
    app.kubernetes.io/component: clickhouse-keeper
