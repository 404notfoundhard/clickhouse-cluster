---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}-keeper
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- $replicas := int .Values.clickhouse.configmap.clickhouseKeeper.replicas }}
{{- $clickhousekeeper_full_name := include "clickhouse-keeper.fullname" . }}
  keeper_config.xml: |-
    <yandex>
      <max_connections>{{ .Values.clickhouse.configmap.clickhouseKeeper.max_connections | default 4096 }}</max_connections>
      <listen_host>0.0.0.0</listen_host>
      <keeper_server>
        <tcp_port>{{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default "2181" }}</tcp_port>
        <server_id>__CHANGEME__</server_id>
        <log_storage_path>/var/lib/clickhouse/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/snapshots</snapshot_storage_path>

        <coordination_settings>
            <auto_forwarding>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.auto_forwarding | default "true" }}</auto_forwarding>
            <dead_session_check_period_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.dead_session_check_period_ms | default "500" }}</dead_session_check_period_ms>
            <election_timeout_lower_bound_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.election_timeout_lower_bound_ms | default "1000" }}</election_timeout_lower_bound_ms>
            <election_timeout_upper_bound_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.election_timeout_upper_bound_ms | default "2000" }}</election_timeout_upper_bound_ms>
            <force_sync>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.force_sync | default "true" }}</force_sync>
            <fresh_log_gap>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.fresh_log_gap | default "200" }}</fresh_log_gap>
            <heart_beat_interval_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.heart_beat_interval_ms | default "500" }}</heart_beat_interval_ms>
            <max_requests_batch_size>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.max_requests_batch_size | default "100" }}</max_requests_batch_size>
            <min_session_timeout_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.min_session_timeout_ms | default "10000" }}</min_session_timeout_ms>
            <operation_timeout_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.operation_timeout_ms | default "10000" }}</operation_timeout_ms>
            <quorum_reads>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.quorum_reads | default "false" }}</quorum_reads>
            <raft_logs_level>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.raft_logs_level | default "information" }}</raft_logs_level>
            <reserved_log_items>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.reserved_log_items | default "100000" }}</reserved_log_items>
            <rotate_log_storage_interval>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.rotate_log_storage_interval | default "100000" }}</rotate_log_storage_interval>
            <session_timeout_ms>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.session_timeout_ms | default "30000" }}</session_timeout_ms>
            <shutdown_timeout>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.shutdown_timeout | default "5000" }}</shutdown_timeout>
            <snapshot_distance>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.snapshot_distance | default "100000" }}</snapshot_distance>
            <snapshots_to_keep>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.snapshots_to_keep | default "3" }}</snapshots_to_keep>
            <stale_log_gap>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.stale_log_gap | default "10000" }}</stale_log_gap>
            <startup_timeout>{{ .Values.clickhouse.configmap.clickhouseKeeper.coordination_settings.startup_timeout | default "30000" }}</startup_timeout>
        </coordination_settings>

        <raft_configuration>
        {{- range untilStep 0 $replicas 1 }}
            <server>
                <id>{{ add . 1 }}</id>
                <hostname>{{ $clickhousekeeper_full_name }}-{{ . }}.{{ $clickhousekeeper_full_name }}-headless.{{ $.Release.Namespace }}.{{ $.Values.clusterDomain }}</hostname>
                <port>{{ $.Values.clickhouse.configmap.clickhouseKeeper.raft_port | default 9444 }}</port>
            </server>
        {{- end }}
        </raft_configuration>
      </keeper_server>
    </yandex>
