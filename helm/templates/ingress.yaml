{{- if .Values.clickhouse.ingress.enabled }}
---
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/rekease: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  rules:
    {{- range $host := .Values.clickhouse.ingress.hosts | default (list "") }}
    - http:
        paths:
          - path: {{ $.Values.clickhouse.baseUrl  }}
            {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: {{ $.Values.clickhouse.ingress.pathType }}
            backend:
              service:
                name: {{ include "clickhouse.fullname" $ }}
                port:
                  name: http
            {{- else }}
            backend:
              serviceName: {{ include "clickhouse.fullname" $ }}
              servicePort: {{ $.Values.clickhouse.httpPort }}
            {{- end }}
      {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
    {{- end }}
  {{- with .Values.clickhouse.ingress.tls }}
  tls:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
