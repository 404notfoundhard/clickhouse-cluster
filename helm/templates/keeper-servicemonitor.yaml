{{- if .Values.clickhouseKeeper.enabled }}
{{- if (.Values.clickhouseKeeper.metrics.serviceMonitor.enabled) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
  {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.namespace }}
  namespace: {{ .Values.clickhouseKeeper.metrics.serviceMonitor.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "clickhouse-keeper.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: metrics
    {{- include "common.tplvalues.render" ( dict "value" .Values.clickhouseKeeper.metrics.serviceMonitor.prometheusSelector "context" $ ) | nindent 4 }}
    {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.clickhouseKeeper.metrics.serviceMonitor.additionalLabels "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.jobLabel }}
  jobLabel: {{ .Values.clickhouseKeeper.metrics.serviceMonitor.jobLabel }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-keeper
      app.kubernetes.io/release: {{ .Release.Name }}
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.selector }}
      {{- include "common.tplvalues.render" (dict "value" .Values.clickhouseKeeper.metrics.serviceMonitor.selector "context" $) | nindent 6 }}
      {{- end }}
  endpoints:
    - port: metrics
      path: "/metrics"
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.interval }}
      interval: {{ .Values.clickhouseKeeper.metrics.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.clickhouseKeeper.metrics.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.relabelings }}
      relabelings:
      {{- include "common.tplvalues.render" ( dict "value" .Values.clickhouseKeeper.metrics.serviceMonitor.relabelings "context" $) | nindent 6 }}
      {{- end }}
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings: {{- include "common.tplvalues.render" ( dict "value" .Values.clickhouseKeeper.metrics.serviceMonitor.metricRelabelings "context" $) | nindent 6 }}
      {{- end }}
      {{- if .Values.clickhouseKeeper.metrics.serviceMonitor.honorLabels }}
      honorLabels: {{ .Values.clickhouseKeeper.metrics.serviceMonitor.honorLabels }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
{{ end }}
