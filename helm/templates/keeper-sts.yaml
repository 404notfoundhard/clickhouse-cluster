{{- if .Values.clickhouseKeeper.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
spec:
  podManagementPolicy: {{ .Values.clickhouseKeeper.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.clickhouseKeeper.updateStrategy }}
    {{- if (eq "Recreate" .Values.clickhouseKeeper.updateStrategy) }}
    rollingUpdate: null
    {{- else if .Values.clickhouseKeeper.rollingUpdatePartition }}
    rollingUpdate:
      partition: {{ .Values.clickhouseKeeper.rollingUpdatePartition }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-keeper # has to match .spec.template.metadata.labels
      app.kubernetes.io/component: clickhouse-keeper
      app.kubernetes.io/release: {{ .Release.Name }}
  serviceName: "{{ include "clickhouse-keeper.fullname" . }}-headless"
  replicas: {{ .Values.clickhouseKeeper.replicas }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-keeper # has to match .spec.selector.matchLabels
        app.kubernetes.io/component: clickhouse-keeper
        app.kubernetes.io/release: {{ .Release.Name }}
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/keeper-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 101
    {{- if .Values.clickhouseKeeper.tolerations }}
      tolerations: {{ toYaml .Values.clickhouseKeeper.tolerations | nindent 8 }}
    {{- end }}
    {{- if .Values.clickhouseKeeper.nodeSelector }}
      nodeSelector: {{ toYaml .Values.clickhouseKeeper.nodeSelector | nindent 8 }}
    {{- end }}
    {{- $preset := default "" .Values.clickhouseKeeper.antiAffinityPreset | toString }}
    {{- $hasNodeAffinity := .Values.clickhouseKeeper.nodeAffinity }}
    {{- if or (eq $preset "required") (eq $preset "preferred") $hasNodeAffinity }}
      affinity:
      {{- if eq $preset "required" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values:
                      - {{ .Chart.Name }}-keeper
                  - key: "app.kubernetes.io/release"
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"
      {{- else if eq $preset "preferred" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - {{ .Chart.Name }}-keeper
                    - key: "app.kubernetes.io/release"
                      operator: In
                      values:
                        - {{ .Release.Name }}
                topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- if $hasNodeAffinity }}
        nodeAffinity: {{ toYaml .Values.clickhouseKeeper.nodeAffinity | nindent 10 }}
      {{- end }}
    {{- end }}
      initContainers:
        - name: busybox
          image: busybox:1.35.0
          command: ["/bin/sh", "-c"]
          args:
            - var=$( printenv MY_POD_NAME | grep -Eo '[0-9]$');
              sed "s/__CHANGEME__/$((var=var+1))/" /tmp/config/keeper_config.xml > /opt/keeper_config.xml;
          volumeMounts:
          - name: temporaryvolume
            mountPath: /opt
          - name: tmp-conf
            mountPath: /tmp/config
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        {{- if .Values.clickhouseKeeper.storage.hostPath.enabled }}
        - name: volume-permissions
          image: busybox:1.35.0
          command: ["/bin/sh", "-c"]
          args:
            - >
              mkdir -p /var/lib/clickhouse_keeper/$(MY_POD_NAME) &&
              chown -R 101:101 /var/lib/clickhouse_keeper/$(MY_POD_NAME)
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse_keeper
        {{- end }}
      containers:
        - name: clickhouse-keeper
          image: {{ .Values.clickhouseKeeper.image }}:{{ .Values.clickhouseKeeper.imageVersion }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: tcp-raft
              containerPort: {{ .Values.clickhouseKeeper.raftPort | default 9444 }}
            - name: tcp-connect
              containerPort: {{ .Values.clickhouseKeeper.tcpPort | default 2181 }}
          startupProbe:
            tcpSocket:
              port: tcp-raft
          readinessProbe:
            exec:
              command: ['/bin/bash', '-c', 'echo ruok | nc 127.1 {{ .Values.clickhouseKeeper.tcpPort | default 2181 }} | grep imok']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['/bin/bash', '-c', 'echo stat | nc 127.1 {{ .Values.clickhouseKeeper.tcpPort | default 2181 }} | grep Received']
            initialDelaySeconds: 40
            periodSeconds: 5
          command: ["clickhouse-keeper", "--config", "/opt/keeper_config.xml"]
          securityContext:
            runAsUser: 101
          {{- with .Values.clickhouseKeeper.resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: temporaryvolume
            mountPath: /opt
          - name: data
            mountPath: /var/lib/clickhouse_keeper
            {{- if .Values.clickhouseKeeper.storage.hostPath.enabled }}
            subPathExpr: $(MY_POD_NAME)
            {{- end }}

      {{- if .Values.clickhouseKeeper.metrics.enabled }}
        - name: ch-keeper-exporter
          image: {{ .Values.clickhouseKeeper.metrics.image.name }}:{{ .Values.clickhouseKeeper.metrics.image.tag }}
          imagePullPolicy: {{ .Values.clickhouseKeeper.metrics.image.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.clickhouseKeeper.metrics.port | default 9141 }}
          command: ['/bin/sh', '-c']
          args:
            - /usr/local/bin/zookeeper-exporter --zk-hosts $(echo $HOSTNAME):{{ .Values.clickhouseKeeper.tcpPort | default 2181 }}
      {{- end }}
      volumes:
        - name: tmp-conf
          configMap:
            name: {{ include "clickhouse-keeper.fullname" . }}
        - name: temporaryvolume
          emptyDir: {}
        {{- if .Values.clickhouseKeeper.storage.hostPath.enabled }}
        - name: data
          hostPath:
            path: {{ .Values.clickhouseKeeper.storage.hostPath.hostPath }}
            type: DirectoryOrCreate
        {{- else if not .Values.clickhouseKeeper.storage.persistentVolumeClaim.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}

  {{- if .Values.clickhouseKeeper.storage.persistentVolumeClaim.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: {{ .Chart.Name }}-keeper
          app.kubernetes.io/component: clickhouse-keeper
          app.kubernetes.io/release: {{ .Release.Name }}
      spec:
        accessModes:
        {{- range .Values.clickhouseKeeper.storage.persistentVolumeClaim.accessModes }}
          - {{ . | quote }}
        {{- end }}
      {{- if .Values.clickhouseKeeper.storage.persistentVolumeClaim.storageClass }}
        storageClassName: {{ .Values.clickhouseKeeper.storage.persistentVolumeClaim.storageClass | quote }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouseKeeper.storage.persistentVolumeClaim.capacity | quote }}
  {{- end }}
{{- end }}
