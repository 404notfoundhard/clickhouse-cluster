{{- if and ( .Values.clickhouse.cluster.enabled ) ( gt .Values.clickhouse.cluster.shards 1.0 ) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-clusters
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-clusters
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- $replicas := int .Values.clickhouse.config.clickhouseKeeper.replicas }}
{{- $clickhousekeeper_full_name := include "clickhouse-keeper.fullname" . }}
  macros.xml: |-
    <?xml version="1.0"?>
    <yandex>
      <macros_include>
          {{- if (.Values.clickhouse.config.macros.override) }}
          <{{ .Values.clickhouse.config.macros.override.replicaOverride }} from_env="HOSTNAME" />
          <{{ .Values.clickhouse.config.macros.override.shardOverride }}>SHARD</{{ .Values.clickhouse.config.macros.override.shardOverride }}>
          {{- else }}
          <replica from_env="HOSTNAME" />
          <shard>SHARD</shard>
          {{- end }}
          {{- if (.Values.clickhouse.config.macros.custom) }}
          {{- range $k,$v := .Values.clickhouse.config.macros.custom }}
          <{{$k}}>{{$v}}</{{$k}}>
          {{- end }}
          {{- end }}
      </macros_include>
    </yandex>

  clusters.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        {{- if .Values.clickhouse.config.zookeeperServers.enabled }}
        <zookeeper>
            {{- range .Values.clickhouse.config.zookeeperServers.config }}
            {{- with . }}
            <node index={{ .index | quote }}>
                <host>{{ .host }}</host>
                <port>{{ .port }}</port>
            </node>
            {{- end }}
            {{- end }}
            <session_timeout_ms>{{ .Values.clickhouse.config.zookeeperServers.session_timeout_ms }}</session_timeout_ms>
            <operation_timeout_ms>{{ .Values.clickhouse.config.zookeeperServers.operation_timeout_ms }}</operation_timeout_ms>
            <root>{{ .Values.clickhouse.config.zookeeperServers.root }}</root>
            <identity>{{ .Values.clickhouse.config.zookeeperServers.identity }}</identity>
        </zookeeper>
        {{- end }}

        {{- if .Values.clickhouse.config.clickhouseKeeper.enabled }}
        <zookeeper>
            {{- range untilStep 0 $replicas 1 }}
            <node>
                <host>{{ $clickhousekeeper_full_name }}-{{ . }}.{{ $clickhousekeeper_full_name }}-headless.{{ $.Release.Namespace }}.{{ $.Values.clusterDomain }}</host>
                <port>{{ $.Values.clickhouse.config.clickhouseKeeper.tcpPort | default 2181 }}</port>
            </node>
            {{- end }}
        </zookeeper>
        {{- end }}

        {{- if .Values.clickhouse.cluster.enabled }}
        <remote_servers>
          {{- if .Values.clickhouse.cluster.clusterName }}
            <{{ .Values.clickhouse.cluster.clusterName }}>
          {{- else }}
            <{{ .Release.Name }}>
          {{- end }}
            {{- range untilStep 0 (int .Values.clickhouse.cluster.shards) 1 }}
                <shard>
                    <internal_replication>{{ $.Values.clickhouse.cluster.internalReplication | default "false" }}</internal_replication>
                    <replica>
                        <host>{{ include "clickhouse.fullname" $ }}-{{ . }}.{{ include "clickhouse.fullname" $ }}-headless.{{ $.Release.Namespace }}.{{ $.Values.clusterDomain }}</host>
                        <port>{{ $.Values.clickhouse.tcpPort}}</port>
                        <user>{{ $.Values.clickhouse.cluster.cluster_user.user }}</user>
                        <password from_env="REPLICATION_PASSWORD" />
                      {{- if $.Values.clickhouse.cluster.compression }}
                        <compression>{{ $.Values.clickhouse.cluster.compression | default "true" }}</compression>
                      {{- end }}
                    </replica>
                    {{- if $.Values.clickhouse.cluster.replication }}
                    <replica>
                        <host>{{ include "clickhouse.fullname" $ }}-replica-{{ . }}.{{ include "clickhouse.fullname" $ }}-replica-headless.{{ $.Release.Namespace }}.{{ $.Values.clusterDomain }}</host>
                        <port>{{ $.Values.clickhouse.tcpPort}}</port>
                        <user>{{ $.Values.clickhouse.cluster.cluster_user.user }}</user>
                        <password from_env="REPLICATION_PASSWORD" />
                      {{- if $.Values.clickhouse.cluster.compression }}
                        <compression>{{ $.Values.clickhouse.cluster.compression | default "true" }}</compression>
                      {{- end }}
                    </replica>
                    {{- end }}
                </shard>
            {{- end }}
          {{- if .Values.clickhouse.cluster.clusterName }}
            </{{ .Values.clickhouse.cluster.clusterName }}>
          {{- else }}
            </{{ .Release.Name }}>
          {{- end }}
        </remote_servers>
        {{- end }}
    </clickhouse>
{{- end }}
