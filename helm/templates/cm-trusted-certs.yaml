{{- if .Values.clickhouse.trusted_certs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-certs
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-certs
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  ca.pem: |
{{ .Values.clickhouse.trusted_certs | indent 4 }}
{{- end }}
