---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}-headless
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: True
  ports:
  - port: {{ .Values.clickhouse.configmap.clickhouseKeeper.raft_port | default 9444 }}
    targetPort: tcp-raft
    protocol: TCP
    name: tcp-raft
  - port: {{ .Values.clickhouse.configmap.clickhouseKeeper.raft_port | default 2181 }}
    targetPort: tcp-connect
    protocol: TCP
    name: tcp-connect
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
    app.kubernetes.io/component: clickhouse-keeper
