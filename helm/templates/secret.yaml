apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "clickhouse.fullname" . }}-secret
data:
  {{- if .Values.clickhouse.cluster.enabled }}
  REPLICATION_PASSWORD: {{ .Values.clickhouse.cluster.cluster_user.password | b64enc }}
  {{- end }}
  {{- range $cluster, $configs := .Values.additionalClusters }}
  {{- if $configs.credentials }}
  INTERNAL_CONNECT_PASSWORD_{{ $cluster }}: {{ $configs.credentials.password | b64enc }}
  {{- end }}
  {{- end }}
  {{- if .Values.clickhouse.config.kafka }}
  SASL_PASSWORD: {{ .Values.clickhouse.config.kafka.sasl_password | b64enc }}
  {{- end }}
  {{- if .Values.clickhouse.config.named_collections }}
  {{- range $collectionName, $collectionParams := .Values.clickhouse.config.named_collections }}
  {{- range $key, $value := $collectionParams }}
{{ include "clickhouse.render_secret_passwords" (dict "parentName" $collectionName "key" $key "value" $value) | indent 2 }}
  {{- end }}
  {{- end }}
  {{- end }}
