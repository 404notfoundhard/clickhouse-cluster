{{- if .Values.clickhouse.config.remoteServers.enabled }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "clickhouse.fullname" . }}-secret
data:
  REPLICATION_PASSWORD: {{ .Values.clickhouse.config.remoteServers.replica.password | b64enc }}
  {{- if .Values.additionalClustersCredentials }}
  EXT_REPLICATION_PASSWORD: {{ .Values.additionalClustersCredentials.password | b64enc }}
  {{- end }}
  {{- if .Values.migration.migrationPassword }}
  MIGRATION_PASSWORD: {{ .Values.migration.migrationPassword | b64enc }}
  {{- end -}}
{{- end }}
