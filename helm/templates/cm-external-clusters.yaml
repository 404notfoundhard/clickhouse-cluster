{{- if (.Values.additionalClusters) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-ext-clusters
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-ext-clusters
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  ext-clusters.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <remote_servers>
        {{- range $cluster, $configs :=  .Values.additionalClusters }}
            <{{ $cluster }}>
            {{- range $shard := $configs.shards }}
                <shard>
                    <internal_replication>{{ $configs.internalReplication | default "true" }}</internal_replication>
                    {{- range  $shard.replicas }}
                    <replica>
                        <host>{{ .host }}</host>
                        <port>{{ .port | default 9000 }}</port>
                        {{- if $configs.credentials }}
                        <user>{{ $configs.credentials.user | default "default" }}</user>
                        <password from_env="INTERNAL_CONNECT_PASSWORD_{{ $cluster }}"/>
                        {{- end }}
                    </replica>
                    {{- end }}
                </shard>
            {{- end }}
            </{{ $cluster }}>
        {{- end }}
        </remote_servers>
    </clickhouse>
{{- end }}
