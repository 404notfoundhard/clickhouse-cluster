{{- if .Values.clickhouseKeeper.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- if and .Values.clickhouseKeeper.externalAccess.enabled .Values.clickhouseKeeper.externalAccess.annotations }}
  annotations:
    {{- toYaml .Values.clickhouseKeeper.externalAccess.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.clickhouseKeeper.externalAccess.enabled }}
  type: LoadBalancer
  {{- end }}
  publishNotReadyAddresses: False
  ports:
  - port: {{ .Values.clickhouseKeeper.tcpPort | default 2181 }}
    targetPort: tcp-connect
    protocol: TCP
    name: tcp-connect
  {{- if .Values.clickhouseKeeper.metrics.enabled }}
  - port: {{ .Values.clickhouseKeeper.metrics.port | default 9141 }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse-keeper

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}-headless
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: True
  ports:
  - port: {{ .Values.clickhouseKeeper.raftPort | default 9444 }}
    targetPort: tcp-raft
    protocol: TCP
    name: tcp-raft
  - port: {{ .Values.clickhouseKeeper.tcpPort | default 2181 }}
    targetPort: tcp-connect
    protocol: TCP
    name: tcp-connect
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse-keeper
{{ end }}
