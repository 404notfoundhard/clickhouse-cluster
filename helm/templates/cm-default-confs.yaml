{{- if (.Values.clickhouse.config) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-default-confs
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-default-confs
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- if .Values.clickhouse.metrics.enabled }}
  metrics.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <prometheus>
            <endpoint>{{.Values.clickhouse.metrics.endpoint | default "/metrics" }}</endpoint>
            <port>{{ .Values.clickhouse.metrics.port | default 9363 }}</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
            <status_info>true</status_info>
        </prometheus>
    </clickhouse>
{{- end }}
  logs.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      {{- range $keys, $values := .Values.clickhouse.config.logs }}
        <{{ $keys }}>
        {{- range $kk, $vv := $values }}
            <{{ $kk }}>{{ $vv }}</{{ $kk }}>
        {{- end }}
        </{{ $keys }}>
      {{- end }}
    </clickhouse>

  merge_tree.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      {{- if .Values.clickhouse.config.merge_tree }}
      <merge_tree>
          {{- range $key, $value := .Values.clickhouse.config.merge_tree }}
          <{{ $key }}>{{ $value }}</{{ $key }}>
          {{- end }}
      </merge_tree>
      {{- else }}
      <merge_tree>
          <max_suspicious_broken_parts>5</max_suspicious_broken_parts>
      </merge_tree>
      {{- end }}
    </clickhouse>
## hardcoded openssl params
  openssl.xml: |-
    <clickhouse>
      <openSSL>
          <server>
              <verificationMode>none</verificationMode>
              <loadDefaultCAFile>true</loadDefaultCAFile>
              <cacheSessions>true</cacheSessions>
              <disableProtocols>sslv2,sslv3</disableProtocols>
              <preferServerCiphers>true</preferServerCiphers>
              <invalidCertificateHandler>
                  <name>RejectCertificateHandler</name>
              </invalidCertificateHandler>
          </server>
          <client>
              <loadDefaultCAFile>true</loadDefaultCAFile>
              <cacheSessions>true</cacheSessions>
              <caConfig>/etc/clickhouse-server/certs/ca.pem</caConfig>
              <disableProtocols>sslv2,sslv3</disableProtocols>
              <preferServerCiphers>true</preferServerCiphers>
              <invalidCertificateHandler>
                  <name>RejectCertificateHandler</name>
              </invalidCertificateHandler>
          </client>
      </openSSL>
    </clickhouse>

  compression.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      <compression>
        {{- range .Values.clickhouse.config.compression.cases }}
        {{- with . }}
        <case>
            <min_part_size>{{ .min_part_size }}</min_part_size>
            <min_part_size_ratio>{{ .min_part_size_ratio }}</min_part_size_ratio>
            <method>{{ .method }}</method>
        </case>
        {{- end }}
        {{- end }}
      </compression>
    </clickhouse>

  {{- if .Values.clickhouse.config.kafka }}
  kafka.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      <kafka>
        {{- range $key, $value := .Values.clickhouse.config.kafka }}
        {{- if eq  $key "sasl_password" }}
          <sasl_password from_env="SASL_PASSWORD" />
        {{- else }}
          <{{ $key }}>{{ $value }}</{{ $key }}>
        {{- end }}
        {{- end }}
      </kafka>
    </clickhouse>
  {{- end }}
  {{- if .Values.clickhouse.config.named_collections }}
  named_collections.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <named_collections>
        {{- range $collectionName, $collectionParams := .Values.clickhouse.config.named_collections }}
            <{{ $collectionName }}>
            {{- range $key, $value := $collectionParams }}
              {{- if eq $key "password" }}
                <password from_env="{{ printf "%s_NMD_PASSWORD" ($collectionName | upper) }}" />
              {{- else }}
                <{{ $key }}>{{ $value }}</{{ $key }}>
              {{- end }}
            {{- end }}
            </{{ $collectionName }}>
        {{- end }}
        </named_collections>
    </clickhouse>
  {{- end }}
  {{- end }}
