{{- if (.Values.clickhouse.config) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-users
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-users
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  users.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
    {{- if .Values.acl.profiles.enabled }}
        <profiles>
        {{- range .Values.acl.profiles.profile }}
        {{- with . }}
            <{{ .name }}>
            {{- range $k_1, $v_1 := .config }}
                <{{ $k_1 }}>{{ $v_1 }}</{{ $k_1 }}>
            {{- end }}
            </{{ .name }}>
        {{- end }}
        {{- end }}
        </profiles>
    {{- end }}

    {{- if (.Values.acl.users) }}
        <users>
        {{- range $key, $value := .Values.acl.users }}
            <{{ $key }}>
            {{- range $k_1, $v_1 := $value }}
            {{- if (eq "networks" $k_1) }}
                <networks>
                {{- range $v_1 }}
                {{- with . }}
                    <ip>{{ . }}</ip>
                {{- end }}
                {{- end }}
                </networks>
            {{- else }}
                {{- if (eq "allow_databases" $k_1) }}
                <allow_databases>
                {{- range $v_1 }}
                {{- with . }}
                    <database>{{ . }}</database>
                {{- end }}
                {{- end }}
                </allow_databases>
                {{- else }}
                <{{ $k_1 }}>{{ $v_1 }}</{{ $k_1 }}>
                {{- end }}    
            {{- end }}
            {{- end }}
            </{{ $key }}>
            {{- end }}
        {{- end }}
        {{- if .Values.clickhouse.cluster.enabled }}
            <{{ .Values.clickhouse.cluster.cluster_user.user }}>
                <profile>default</profile>
                <quota>default</quota>
                <networks>
                    {{- range .Values.clickhouse.cluster.cluster_user.aclNetwork }}
                    <ip>{{ . }}</ip>
                    {{- end }}
                </networks>
                <password from_env="REPLICATION_PASSWORD" />
            </{{ .Values.clickhouse.cluster.cluster_user.user }}>
        {{- end }}
        </users>
    {{- if .Values.acl.quotas.enabled }}
        <quotas>
        {{- range $key, $value := .Values.acl.quotas.quota }}
        {{- with . }}
            <{{ .name }}>
            {{- range $k_1, $v_1 := .config }}
                <{{ $k_1 }}>{{ $v_1 }}</{{ $k_1 }}>
            {{- end }}
            </{{ .name }}>
        {{- end }}
        {{- end }}
        </quotas>
    {{- end }}
    </clickhouse>
{{- end }}
