---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
  {{- if .Values.clickhouse.externalAccess }}
  {{- if and (eq "loadbalancer" (.Values.clickhouse.externalAccess.type | lower)) (.Values.clickhouse.externalAccess.LoadBalancer.annotations) }}
  annotations:
  {{- toYaml .Values.clickhouse.externalAccess.LoadBalancer.annotations | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if .Values.clickhouse.externalAccess }}
  {{- if eq "loadbalancer" (.Values.clickhouse.externalAccess.type | lower)  }}
  type: LoadBalancer
  {{- end }}
  {{- end }}
  publishNotReadyAddresses: False
  ports:
  - port: {{ .Values.clickhouse.tcpPort }}
    targetPort: tcp
    protocol: TCP
    name: tcp
  - port: {{ .Values.clickhouse.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  {{- if .Values.clickhouse.metrics.enabled }}
  - port: {{ .Values.clickhouse.metrics.port | default "9363" }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}

{{- if and ( .Values.clickhouse.cluster.enabled ) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-headless
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-headless
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}-headless
    app.kubernetes.io/release: {{ .Release.Name }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: True
  ports:
  - port: {{ .Values.clickhouse.interserverHttpPort }}
    targetPort: inter-http
    protocol: TCP
    name: inter-http
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
{{- end }}
