---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
spec:
  ports:
  - port: {{ .Values.clickhouse.tcpPort }}
    targetPort: tcp
    protocol: TCP
    name: tcp
  - port: {{ .Values.clickhouse.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.clickhouse.interserverHttpPort }}
    targetPort: inter-http
    protocol: TCP
    name: inter-http
  {{- if .Values.clickhouse.metrics.enabled }}
  - port: {{ .Values.clickhouse.metrics.port | default "9363" }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}

{{- if gt .Values.clickhouse.replicas 1.0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-headless
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-headless
    app.kubernetes.io/instance: {{ .Release.Name }}-headless
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: "None"
  ports:
  - port: {{ .Values.clickhouse.tcpPort }}
    targetPort: tcp
    protocol: TCP
    name: tcp
  - port: {{ .Values.clickhouse.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.clickhouse.interserverHttpPort }}
    targetPort: inter-http
    protocol: TCP
    name: inter-http
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}

{{- if .Values.clickhouse.config.remoteServers.replica.backup.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-replica-headless
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica-headless
    app.kubernetes.io/instance: {{ .Release.Name }}-replica-headless
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: "None"
  ports:
  - port: {{ .Values.clickhouse.tcpPort }}
    targetPort: tcp
    protocol: TCP
    name: tcp
  - port: {{ .Values.clickhouse.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.clickhouse.interserverHttpPort }}
    targetPort: inter-http
    protocol: TCP
    name: inter-http
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-replica
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/release: {{ .Release.Name }}
spec:
  ports:
  - port: {{ .Values.clickhouse.tcpPort }}
    targetPort: tcp
    protocol: TCP
    name: tcp
  - port: {{ .Values.clickhouse.httpPort }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.clickhouse.interserverHttpPort }}
    targetPort: inter-http
    protocol: TCP
    name: inter-http
  {{- if .Values.clickhouse.metrics.enabled }}
  - port: {{ .Values.clickhouse.metrics.port | default "9363" }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
{{- end }}
{{- end }}
