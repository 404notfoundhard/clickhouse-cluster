{{- $outer := . -}}
{{- $shards := 1 }}
{{- if $.Values.clickhouse.cluster.enabled }}
{{- $shards = (.Values.clickhouse.cluster.shards|int)}}
{{- end }}
{{- range $shard := until $shards }}
---
{{- with  $outer }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ include "clickhouse.fullname" . }}-{{ $shard }}"
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
{{- if $.Values.clickhouse.cluster.enabled }}
  replicas: {{ $.Values.clickhouse.cluster.replicas }}
{{- else }}
  replicas: 1
{{- end }}
  podManagementPolicy: {{ $.Values.clickhouse.podManagementPolicy }}
  updateStrategy:
    type: {{ $.Values.clickhouse.updateStrategy }}
    {{- if (eq "Recreate" $.Values.clickhouse.updateStrategy) }}
    rollingUpdate: null
    {{- else if $.Values.clickhouse.rollingUpdatePartition }}
    rollingUpdate:
      partition: {{ $.Values.clickhouse.rollingUpdatePartition }}
    {{- end }}
  {{- if $.Values.clickhouse.cluster.enabled }}
  serviceName: clickhouse-headless
  {{- else }}
  serviceName: clickhouse
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clickhouse.name" . }}
      app.kubernetes.io/release: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clickhouse.name" . }}
        app.kubernetes.io/release: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
        app.kubernetes.io/shard: {{ $shard | quote }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/configmap-users: {{ include (print $.Template.BasePath "/cm-users.yaml") . | sha256sum }}
        checksum/configmap-main-config: {{ include (print $.Template.BasePath "/cm-main-conf.yaml") . | sha256sum }}
        checksum/configmap-cluster-config: {{ include (print $.Template.BasePath "/cm-cluster-conf.yaml") . | sha256sum }}
        checksum/configmap-default-configs: {{ include (print $.Template.BasePath "/cm-default-confs.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 101
    {{- if .Values.clickhouse.affinity }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/shard"
                    operator: In
                    values: [{{ $shard | quote }}]
              topologyKey: "kubernetes.io/hostname"
        {{- if .Values.clickhouse.affinity.NodeAffinityCustom }}
        nodeAffinity: {{ toYaml .Values.clickhouse.affinity.NodeAffinityCustom | nindent 10 }}
        {{- end }}
    {{- end }}
      initContainers:
        - name: init-clickhouse
          image: {{ .Values.clickhouse.image }}:{{ .Values.clickhouse.imageVersion }}
          command:
            - /bin/sh
            - -c
            - |
              rm -f {{ .Values.clickhouse.config.clickhouseDefaults.path }}status
              {{- if .Values.fixPermission }}
              chown -R clickhouse:clickhouse {{ .Values.clickhouse.config.clickhouseDefaults.path }}
              {{- end }}
          volumeMounts:
            - name: {{ include "clickhouse.fullname" . }}-data
              mountPath: {{ .Values.clickhouse.config.clickhouseDefaults.path }}
          securityContext:
            runAsUser: 0
      containers:
        - name: {{ include "clickhouse.fullname" . }}
          image: {{ .Values.clickhouse.image }}:{{ .Values.clickhouse.imageVersion }}
          imagePullPolicy: {{ .Values.clickhouse.imagePullPolicy }}
          {{- if or (gt .Values.clickhouse.cluster.shards 1.0) (.Values.tinyDicts) }}
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - |
                    {{- if gt .Values.clickhouse.cluster.shards 1.0 }}
                    var=$( printenv HOSTNAME | grep -Eo '[0-9]$');
                    mkdir /etc/clickhouse-server/spec
                    sed  "s/SHARD/shard$var/" /opt/macros.xml >> /etc/clickhouse-server/spec/metrika.xml;
                    {{- end}}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "clickhouse.fullname" . }}-secret
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.httpPort | default "8123" }}
            - name: tcp
              containerPort: {{ .Values.clickhouse.tcpPort | default "9000" }}
            - name: inter-http
              containerPort: {{ .Values.clickhouse.interserverHttpPort | default "9009" }}
            {{- if .Values.clickhouse.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.clickhouse.metrics.port | default "9363" }}
            {{- end }}
          {{- if default false .Values.clickhouse.readinessProbe }}
          readinessProbe: {{ toYaml .Values.clickhouse.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if default false $.Values.clickhouse.livenessProbe }}
          livenessProbe: {{ toYaml .Values.clickhouse.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if default false .Values.clickhouse.resources }}
          resources: {{ toYaml .Values.clickhouse.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ include "clickhouse.fullname" . }}-data
              mountPath: {{ .Values.clickhouse.config.clickhouseDefaults.path }}
            {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
            - name: {{ include "clickhouse.fullname" . }}-logs
              mountPath: {{ include "clickhouse.logpath" . }}
            {{- end }}
            {{- if .Values.clickhouse.persistentVolumeClaim.inMemData.enabled }}
            - name: clickhouse-in-mem-data
              mountPath: {{ .Values.clickhouse.config.clickhouseDefaults.path }}/store
            {{- end }}
            {{- if .Values.clickhouse.cluster.enabled  }}
            - name: clickhouse-macros
              mountPath: /opt/macros.xml
              subPath: macros.xml
            {{- end }}
            {{- if .Values.clickhouse.userFiles }}
            - name: userfiles
              mountPath: {{ $.Values.clickhouse.config.clickhouseDefaults.user_files_path }}
            {{- end }}
            - name: clickhouse-configs
              mountPath: /etc/clickhouse-server/config.d
            - name: clickhouse-users
              mountPath: /etc/clickhouse-server/users.xml
              subPath: users.xml
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.xml
              subPath: config.xml
          securityContext:
            runAsUser: 101
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE", "IPC_LOCK"]
      volumes:
        {{- if (.Values.clickhouse.config) }}
        - name: clickhouse-config
          configMap:
            name: {{ include "clickhouse.fullname" . }}-main-config
            items:
            - key: config.xml
              path: config.xml
        - name: clickhouse-users
          configMap:
            name: {{ include "clickhouse.fullname" . }}-users
            items:
            - key: users.xml
              path: users.xml
        {{- if .Values.clickhouse.cluster.enabled }}
        - name: clickhouse-macros
          configMap:
            name: {{ include "clickhouse.fullname" . }}-cluster-conf
            items:
            - key: macros.xml
              path: macros.xml
        {{- end }}
        {{- if .Values.clickhouse.userFiles }}
        - name: userfiles
          configMap:
            name: {{ include "clickhouse.fullname" . }}-userfiles
            items:
            {{- range  $k,$v := .Values.clickhouse.userFiles }}
              - key: {{ $k }}
                path: {{ $k }}
            {{- end }}
        {{- end }}
        - name: clickhouse-configs
          projected:
            sources:
            {{- if .Values.clickhouse.cluster.enabled }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-cluster-conf
                  items:
                  - key: cluster.xml
                    path: cluster.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-cluster-conf
                  items:
                  - key: keeper.xml
                    path: keeper.xml
              {{- end }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-default-confs
                  items:
                  - key: logs.xml
                    path: logs.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-default-confs
                  items:
                  - key: merge_tree.xml
                    path: merge_tree.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-default-confs
                  items:
                  - key: compression.xml
                    path: compression.xml
                {{- if .Values.clickhouse.metrics.enabled }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-default-confs
                  items:
                  - key: metrics.xml
                    path: metrics.xml
                {{- end }}
                {{- if .Values.clickhouse.config.kafka }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-default-confs
                  items:
                  - key: kafka.xml
                    path: kafka.xml
                {{- end }}
                {{- if (.Values.additionalClusters) }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-ext-clusters
                  items:
                  - key: ext-clusters.xml
                    path: ext-clusters.xml
                {{- end }}
        {{- end }}
        - name: {{ include "clickhouse.fullname" . }}-data
        {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "clickhouse.fullname" . }}-data
        {{- end }}
        {{- if .Values.clickhouse.persistentVolumeClaim.inMemData.enabled }}
        - name: clickhouse-in-mem-data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.clickhouse.persistentVolumeClaim.inMemData.size }}
        {{- end }}
        {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
        - name: {{ include "clickhouse.fullname" . }}-logs
          persistentVolumeClaim:
            claimName: {{ include "clickhouse.fullname" . }}-logs
        {{- end }}
  {{- if .Values.clickhouse.persistentVolumeClaim.enabled }}
  volumeClaimTemplates:
    {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.enabled }}
    - metadata:
        name: {{ include "clickhouse.fullname" . }}-data
        labels:
          app.kubernetes.io/name: {{ include "clickhouse.name" . }}-data
          app.kubernetes.io/release: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
          app.kubernetes.io/managed-by: {{ .Release.Service }}
      spec:
        accessModes:
        {{- range .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.accessModes }}
          - {{ . | quote }}
        {{- end }}
      {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storageClassName }}
        storageClassName: {{ .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storageClassName | quote }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storage | quote }}
    {{- end }}
    {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
    - metadata:
        name: {{ include "clickhouse.fullname" . }}-logs
        labels:
          app.kubernetes.io/name: {{ include "clickhouse.name" . }}-logs
          app.kubernetes.io/release: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
          app.kubernetes.io/managed-by: {{ .Release.Service }}
      spec:
        accessModes:
      {{- range .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.accessModes }}
        - {{ . | quote }}
      {{- end }}
      {{- if (eq "-" .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storageClassName) }}
        storageClassName: ""
      {{- else }}
        storageClassName: {{ .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storageClassName | quote }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storage | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
