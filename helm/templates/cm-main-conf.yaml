---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-main-config
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-main-config
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
      {{- if and ( .Values.clickhouse.cluster.enabled ) ( gt .Values.clickhouse.cluster.shards 1.0 ) }}
      <include_from>/etc/clickhouse-server/spec/metrika.xml</include_from>
      <macros incl="macros_include" />
      {{- end }}
      <listen_host>0.0.0.0</listen_host>
      <http_port>{{ .Values.clickhouse.httpPort | default "8123" }}</http_port>
      <tcp_port>{{ .Values.clickhouse.tcpPort | default "9000" }}</tcp_port>
      <interserver_http_port>{{ .Values.clickhouse.interserverHttpPort | default "9009" }}</interserver_http_port>
      {{- if .Values.clickhouse.config.clickhouseDefaults.display_name }}
      <display_name>{{ .Values.clickhouse.config.clickhouseDefaults.display_name }}</display_name>
      {{- else }}
      <display_name>{{ template "clickhouse.fullname" . }}</display_name>
      {{- end }}
      <users_config>users.xml</users_config>
    {{- range $key, $value := .Values.clickhouse.config.clickhouseDefaults }}
      {{- if eq $key "display_name" }}
      {{- else }}
      <{{ $key }}>{{ $value }}</{{ $key }}>
      {{- end }}
    {{- end }}
      <user_directories>
        <users_xml>
            <path>users.xml</path>
        </users_xml>
      </user_directories>

    </clickhouse>
