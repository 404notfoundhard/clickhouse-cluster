{{- if (.Values.additionalClusters) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-ext-clusters
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-clusters
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- $clickhousekeeper_full_name := include "clickhouse-keeper.fullname" . }}
{{- $replicationPort := .Values.clickhouse.tcpPort }}
  ext-clusters.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <remote_servers>
        {{- range $cluster, $configs :=  .Values.additionalClusters }}
            <{{ $cluster }}>
                {{- range $key, $values := $configs }}
                <shard>
                    <internal_replication>{{ $values.internalReplication }}</internal_replication>
                    {{- range $values.replicas }}
                    <replica>
                        <host>{{ . }}</host>
                        <port>{{ $replicationPort | default 9000 }}</port>
                        {{- if $.Values.additionalClustersCredentials }}
                        <user>{{ $.Values.additionalClustersCredentials.user }}</user>
                        <password from_env="EXT_REPLICATION_PASSWORD"/>
                        {{- end }}
                    </replica>
                    {{- end }}
                </shard>
                {{- end }}
            </{{ $cluster }}>
        {{- end }}
        </remote_servers>
    </clickhouse>
{{- end }}
