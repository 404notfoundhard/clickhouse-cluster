{{- if (.Values.clickhouse.config) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-config
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.xml: |-
    <?xml version="1.0"?>
    <yandex>
      <include_from>/etc/clickhouse-server/macros.d/macros.xml</include_from>
      <macros incl="macros_include" />
      <listen_host>0.0.0.0</listen_host>
      <http_port>{{ .Values.clickhouse.httpPort | default "8123" }}</http_port>
      <tcp_port>{{ .Values.clickhouse.tcpPort | default "9000" }}</tcp_port>
      <interserver_http_port>{{ .Values.clickhouse.interserverHttpPort | default "9009" }}</interserver_http_port>
      <display_name>{{ template "clickhouse.fullname" . }}</display_name>
      <users_config>users.xml</users_config>
    {{- range $key, $value := .Values.clickhouse.config.clickhouseDefaults }}
      <{{ $key }}>{{ $value }}</{{ $key }}>
    {{- end }}

      <distributed_ddl>
      {{- range $key, $value := .Values.clickhouse.config.distributed_ddl }}
        <{{ $key }}>{{ $value }}</{{ $key }}>
      {{- end }}
      </distributed_ddl>
    </yandex>
{{- end }}
