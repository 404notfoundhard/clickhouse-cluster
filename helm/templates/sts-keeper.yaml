---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-keeper # has to match .spec.template.metadata.labels
      app.kubernetes.io/component: clickhouse-keeper
      app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
  serviceName: "{{ include "clickhouse-keeper.fullname" . }}-headless"
  replicas: {{ .Values.clickhouse.configmap.clickhouseKeeper.replicas }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-keeper # has to match .spec.selector.matchLabels
        app.kubernetes.io/component: clickhouse-keeper
        app.kubernetes.io/release: {{ include "clickhouse-keeper.fullname" . }}
    spec:
{{- if .Values.clickhouse.configmap.clickhouseKeeper.podAntiAffinity.enable }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values: 
                      - {{ .Chart.Name }}-keeper
                  - key: "app.kubernetes.io/release"
                    operator: In
                    values:
                      - {{ include "clickhouse-keeper.fullname" . }}
              topologyKey: "kubernetes.io/hostname"
{{- end }}
      initContainers:
      - name: busybox
        image: busybox:1.35.0
        command: ["/bin/sh", "-c"]
        args: 
          - var=$( printenv MY_POD_NAME | grep -Eo '[0-9]$');
            sed "s/__CHANGEME__/$((var=var+1))/" /tmp/config/keeper_config.xml > /opt/keeper_config.xml;
        volumeMounts:
        - name: testdata
          mountPath: /opt
        - name: tmp-conf
          mountPath: /tmp/config
        env:
          - name: MY_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      volumes:
        - name: tmp-conf
          configMap:
            name: {{ include "clickhouse-keeper.fullname" . }}
      containers:
      {{- if .Values.clickhouse.configmap.clickhouseKeeper.metrics.enabled }}
      - name: ch-keeper-exporter
        image: dabealu/zookeeper-exporter:v0.1.12
        imagePullPolicy: IfNotPresent
        ports:
          - name: metrics
            containerPort: {{ .Values.clickhouse.configmap.clickhouseKeeper.metrics.port | default 9141 }}
        command: ['/bin/sh', '-c']
        args:
          - /usr/local/bin/zookeeper-exporter --zk-hosts $(echo $HOSTNAME):{{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default 2181 }}
      {{- end }}
      - name: clickhouse-keeper
        image: {{ .Values.clickhouse.configmap.clickhouseKeeper.image }}:{{ .Values.clickhouse.configmap.clickhouseKeeper.imageVersion }}
        imagePullPolicy: IfNotPresent
        ports:
          - name: tcp-raft
            containerPort: {{ .Values.clickhouse.configmap.clickhouseKeeper.raft_port | default 9444 }}
          - name: tcp-connect
            containerPort: {{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default 2181 }}
        startupProbe:
          tcpSocket:
            port: tcp-raft
        readinessProbe:
          exec:
            command: ['/bin/bash', '-c', 'echo ruok | nc 127.1 {{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default 2181 | quote }} | grep imok']
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ['/bin/bash', '-c', 'echo ruok | nc 127.1 {{ .Values.clickhouse.configmap.clickhouseKeeper.tcp_port | default 2181 | quote }} | grep imok']
          initialDelaySeconds: 40
          periodSeconds: 5
        command: ["clickhouse-keeper", "--config", "/opt/keeper_config.xml"]
        securityContext:
          runAsUser: 101
        {{- with .Values.clickhouse.configmap.clickhouseKeeper.resources }}
        resources:
        {{- . | toYaml | nindent 12 }}
        {{- end }}
        volumeMounts:
        - name: testdata
          mountPath: /opt
  volumeClaimTemplates:
  - metadata:
      name: testdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "cephfs"
      resources:
        requests:
          storage: 10Mi
