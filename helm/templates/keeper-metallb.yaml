{{- if .Values.clickhouse.config.clickhouseKeeper.enabled }}
{{- if .Values.clickhouse.config.clickhouseKeeper.externalAccess.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse-keeper.fullname" . }}-lb
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  publishNotReadyAddresses: True
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/release: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse-keeper
  {{- if .Values.clickhouse.config.clickhouseKeeper.externalAccess.loadBalancerIP }}
  loadBalancerIP: {{ .Values.clickhouse.config.clickhouseKeeper.externalAccess.loadBalancerIP }}
  {{- end }}
  ports:
    - name: keeper-nodes
      port: {{ .Values.clickhouse.config.clickhouseKeeper.tcpPort }}
      targetPort: tcp-connect
      protocol: TCP
  type: LoadBalancer
{{- end }}
{{ end }}
