{{- if and (.Values.clickhouse.cluster.replication) (eq .Values.clickhouse.cluster.enabled false) }}
{{- fail "You can't create 1 shard with replica without enalbed cluster! " }}
{{- end }}
{{- if .Values.clickhouse.cluster.replication }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}-replica
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
    app.kubernetes.io/clickhouseRole: "replica"
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.clickhouse.cluster.shards }}
  podManagementPolicy: {{ .Values.clickhouse.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.clickhouse.updateStrategy }}
    {{- if (eq "Recreate" .Values.clickhouse.updateStrategy) }}
    rollingUpdate: null
    {{- else if .Values.clickhouse.rollingUpdatePartition }}
    rollingUpdate:
      partition: {{ .Values.clickhouse.rollingUpdatePartition }}
    {{- end }}
  serviceName: {{ include "clickhouse.fullname" . }}-replica-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
      app.kubernetes.io/release: {{ .Release.Name }}
      app.kubernetes.io/clickhouseRole: "replica"
      app.kubernetes.io/clickhouseOption: "replicated"
      app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica
        app.kubernetes.io/release: {{ .Release.Name }}
        app.kubernetes.io/clickhouseRole: "replica"
        app.kubernetes.io/clickhouseOption: "replicated"
        app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/configmap-users: {{ include (print $.Template.BasePath "/configmap-users.yaml") . | sha256sum }}
        checksum/configmap-config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        checksum/configmap-configs: {{ include (print $.Template.BasePath "/configmap-configs.yaml") . | sha256sum }}
    spec:
    {{- if .Values.clickhouse.affinity }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/instance"
                    operator: In
                    values: [{{ include "clickhouse.fullname" . | quote }}]
                  - key: "app.kubernetes.io/clickhouseRole"
                    operator: In
                    values: ["Master"]
              topologyKey: "kubernetes.io/hostname"
    {{- end }}
      initContainers:
        - name: init-clickhouse
          image: {{ .Values.clickhouse.image }}:{{ .Values.clickhouse.imageVersion }}
          command:
            - /bin/sh
            - -c
            - |
              chown clickhouse:clickhouse {{ .Values.clickhouse.config.clickhouseDefaults.path }}
              rm -f {{ .Values.clickhouse.config.clickhouseDefaults.path }}/status
              {{- if .Values.fixPermission }}
              chown -R clickhouse:clickhouse {{ .Values.clickhouse.config.clickhouseDefaults.path }}
              {{- end }}
          volumeMounts:
            - name: {{ include "clickhouse.fullname" . }}-replica-data
              mountPath: {{ .Values.clickhouse.config.clickhouseDefaults.path }}
          securityContext:
            runAsUser: 0
      containers:
        - name: {{ include "clickhouse.fullname" . }}-replica
          image: {{ .Values.clickhouse.image }}:{{ .Values.clickhouse.imageVersion }}
          imagePullPolicy: {{ .Values.clickhouse.imagePullPolicy }}
          {{- if or (gt .Values.clickhouse.cluster.shards 1.0) (.Values.tinyDicts) }}
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - |
                    {{- if gt .Values.clickhouse.cluster.shards 1.0 }}
                    var=$( printenv HOSTNAME | grep -Eo '[0-9]$');
                    mkdir /etc/clickhouse-server/spec
                    sed  "s/SHARD/shard$var/" /opt/macros.xml >> /etc/clickhouse-server/spec/metrika.xml;
                    {{- end}}
                    {{- if (.Values.tinyDicts) }}
                    {{- range  $k,$v := .Values.tinyDicts.dictionaries }}
                    ln -s /etc/clickhouse-server/dictionaries/{{ $k }} {{ $.Values.clickhouse.config.clickhouseDefaults.user_files_path }}{{ $k }} || true;
                    {{- end }}
                    {{- end }}
          {{- end }}

          {{- if .Values.clickhouse.cluster.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "clickhouse.fullname" . }}-secret
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.httpPort | default "8123" }}
            - name: tcp
              containerPort: {{ .Values.clickhouse.tcpPort | default "9000" }}
            - name: inter-http
              containerPort: {{ .Values.clickhouse.interserverHttpPort | default "9009" }}
            {{- if .Values.clickhouse.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.clickhouse.metrics.port | default "9363" }}
            {{- end }}

          {{- if default false .Values.clickhouse.readinessProbe }}
          readinessProbe: {{ toYaml .Values.clickhouse.readinessProbe | nindent 12 }}
          {{- end }}

          {{- if default false .Values.clickhouse.livenessProbe }}
          livenessProbe: {{ toYaml .Values.clickhouse.livenessProbe | nindent 12 }}
          {{- end }}

          {{- if default false .Values.clickhouse.resources }}
          resources: {{ toYaml .Values.clickhouse.resources | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: {{ include "clickhouse.fullname" . }}-replica-data
              mountPath: {{ .Values.clickhouse.config.clickhouseDefaults.path }}
            {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
            - name: {{ include "clickhouse.fullname" . }}-replica-logs
              mountPath: {{ include "clickhouse.logpath" . }}
            {{- end }}
            - name: clickhouse-macros
              mountPath: /opt/macros.xml
              subPath: macros.xml
            {{- if (.Values.tinyDicts) }}
            - name: dictionaries
              mountPath: {{ .Values.tinyDicts.path }}
            {{- end }}
            - name: clickhouse-configs
              mountPath: /etc/clickhouse-server/config.d
            - name: clickhouse-users
              mountPath: /etc/clickhouse-server/users.xml
              subPath: users.xml
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.xml
              subPath: config.xml

          securityContext:
            runAsUser: 101
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE", "IPC_LOCK"]

    {{- if .Values.clickhouse.nodeSelector }}
      nodeSelector: {{ toYaml .Values.clickhouse.nodeSelector | nindent 8 }}
    {{- end }}
      volumes:
        {{- if (.Values.clickhouse.config) }}
        - name: clickhouse-config
          configMap:
            name: {{ include "clickhouse.fullname" . }}-config
            items:
            - key: config.xml
              path: config.xml
        - name: clickhouse-users
          configMap:
            name: {{ include "clickhouse.fullname" . }}-users
            items:
            - key: users.xml
              path: users.xml
        - name: clickhouse-macros
          configMap:
            name: {{ include "clickhouse.fullname" . }}-clusters
            items:
            - key: macros.xml
              path: macros.xml
        {{- if (.Values.tinyDicts) }}
        - name: dictionaries
          configMap:
            name: {{ include "clickhouse.fullname" . }}-dictionaries
            items:
          {{- range  $k,$v := .Values.tinyDicts.dictionaries }}
            - key: {{ $k }}
              path: {{ $k }}
          {{- end }}
        {{- end }}
        - name: clickhouse-configs
          projected:
            sources:
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-clusters
                  items:
                  - key: clusters.xml
                    path: clusters.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-configs
                  items:
                  - key: logs.xml
                    path: logs.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-configs
                  items:
                  - key: merge_tree.xml
                    path: merge_tree.xml
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-configs
                  items:
                  - key: compression.xml
                    path: compression.xml
                {{- if .Values.clickhouse.metrics.enabled }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-configs
                  items:
                  - key: metrics.xml
                    path: metrics.xml
                {{- end }}
                {{- if (.Values.additionalClusters) }}
              - configMap:
                  name: {{ include "clickhouse.fullname" . }}-ext-clusters
                  items:
                  - key: ext-clusters.xml
                    path: ext-clusters.xml
                {{- end }}
        {{- end }}
        - name: {{ include "clickhouse.fullname" . }}-replica-data
        {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "clickhouse.fullname" . }}-replica-data
        {{- else }}
          emptyDir:
        {{- end }}
        {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
        - name: {{ include "clickhouse.fullname" . }}-replica-logs
          persistentVolumeClaim:
            claimName: {{ include "clickhouse.fullname" . }}-replica-logs
        {{- end }}
  {{- if .Values.clickhouse.persistentVolumeClaim.enabled }}
  volumeClaimTemplates:
    {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.enabled }}
    - metadata:
        name: {{ include "clickhouse.fullname" . }}-replica-data
        labels:
          app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica-data
          app.kubernetes.io/release: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}-replica-data
          app.kubernetes.io/managed-by: {{ .Release.Service }}
      spec:
        accessModes:
        {{- range .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.accessModes }}
          - {{ . | quote }}
        {{- end }}
      {{- if .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storageClassName }}
        storageClassName: {{ .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storageClassName | quote }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistentVolumeClaim.dataPersistentVolume.storage | quote }}
    {{- end }}
    {{- if .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.enabled }}
    - metadata:
        name: {{ include "clickhouse.fullname" . }}-replica-logs
        labels:
          app.kubernetes.io/name: {{ include "clickhouse.name" . }}-replica-logs
          app.kubernetes.io/release: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ include "clickhouse.fullname" . }}-replica-data
          app.kubernetes.io/managed-by: {{ .Release.Service }}
      spec:
        accessModes:
      {{- range .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.accessModes }}
        - {{ . | quote }}
      {{- end }}
      {{- if (eq "-" .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storageClassName) }}
        storageClassName: ""
      {{- else }}
        storageClassName: {{ .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storageClassName | quote }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistentVolumeClaim.logsPersistentVolume.storage | quote }}
  {{- end }}
{{- end }}
{{- end }}
