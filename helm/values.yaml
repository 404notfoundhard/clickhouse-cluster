clusterDomain: "svc.k8s"

## This credentials are substituted into every shard of all additionalClusters
# additionalClustersCredentials:
#   user: replica_tech
#   password: some_password

additionalClusters: {}
  # clust_repl:
  # - internalReplication: false
    # replicas:
      # - host1
      # - host2
  # - internalReplication: false
    # replicas:
      # - host3

migration:
  enabled: false
  image: "clickhouse/clickhouse-server"
  imageVersion: "22.8.1.2097"
  repo: https://gitlab.dev.cems/infra/dbms/clickhouse-schema-queries.git
  repoToken: GITLAB_TOKEN_PLEZ
  repoRef: minor/devops-1734
  migrationUser: "default"
  migrationPassword: "test"
  command: |
     cd clickhouse-schema-queries/CEMS/schema/;
     ls -1 | xargs -I {} clickhouse-client -h clickhouse-0.clickhouse-headless --user $ENV_USER --password $ENV_PASSWORD --query="CREATE DATABASE IF NOT EXISTS {} ON CLUSTER cems";
     find . -type f -path '*tables/*' | xargs -I {} cat {} |  clickhouse-client -m -n -h clickhouse-0.clickhouse-headless --user $ENV_USER --password $ENV_PASSWORD
     find . -type f -path '*distributed/*' | xargs -I {} cat {} |  clickhouse-client -m -n -h clickhouse-0.clickhouse-headless --user $ENV_USER --password $ENV_PASSWORD
     find . -type f -path '*view/*' | xargs -I {} cat {} |  clickhouse-client -m -n -h clickhouse-0.clickhouse-headless --user $ENV_USER --password $ENV_PASSWORD


acl:
  profiles:
    enabled: true
    profile:
      - name: "default"
        config:
          background_pool_size: 40
          load_balancing: random
          max_memory_usage: "310394000" # must be quoted
          max_partitions_per_insert_block: 1000
          skip_unavailable_shards: 1
          use_uncompressed_cache: 0

  users:
    default:
      # # empty password
      # password: ""
      # password_sha256_hex: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      networks:
      - "0.0.0.0/0"
      profile: "default"
      quota: "default"

  quotas:
    enabled: true
    quota:
      - name: "default"
        config:
          duration: 3600
          queries: 0
          errors: 0
          result_rows: 0
          read_rows: 0
          execution_time: 0


clickhouse:
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  replicas: 1
  image: "clickhouse/clickhouse-server"
  imageVersion: "22.8.1.2097"
  imagePullPolicy: "IfNotPresent"

  podManagementPolicy: "Parallel"
  updateStrategy: "RollingUpdate"

  metrics:
    enabled: false
    port: 9363
    endpoint: /metrics
    serviceMonitor:
      enabled: true
      additionalLabels: {}
      prometheusSelector:
        service-monitor: "true"
      # jobLabel:
      selector:
      namespace:
      interval:
      scrapeTimeout:
      relabelings:
      metricRelabelings:
      honorLabels:

  # affinity:
  #   preset: "required"

  httpPort: "8123"
  tcpPort: "9000"
  interserverHttpPort: "9009"

  externalAccess:
    enabled: false
    # loadBalancerIP: 10.10.10.10

  livenessProbe:
    httpGet:
      path: /ping
      port: http-port
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    tcpSocket:
      port: tcp-port
    initialDelaySeconds: 4
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  persistentVolumeClaim:
    enabled: true
    dataPersistentVolume:
      enabled: true
      accessModes:
        - "ReadWriteOnce"
      # storageClassName: ""
      storage: "1Gi"
    logsPersistentVolume:
      enabled: false


  ingress:
    enabled: false
    # annotations: {}
    # baseUrl: /
    # hosts:
    #   - clickhouse.domain.corp
    # pathSuffix:
    # pathType: Prefix
    # tls:
    #   - hosts:
    #     - clickhouse.domain.corp

  config:
    clickhouseDefaults:
      path: /var/lib/clickhouse/
      tmp_path: /var/lib/clickhouse/tmp/
      user_files_path: /var/lib/clickhouse/user_files/
      format_schema_path: /var/lib/clickhouse/format_schemas/
      top_level_domains_path: /var/lib/clickhouse/top_level_domains/
      buffer_profile: default
      builtin_dictionaries_reload_interval: "3600"
      compiled_expression_cache_elements_size: "10000"
      compiled_expression_cache_size: "134217728"
      custom_settings_prefixes:
      default_database: default
      default_profile: default
      default_session_timeout: "60"
      dictionaries_config: "*_dictionary.xml"
      disable_internal_dns_cache: "1"
      keep_alive_timeout: "3"
      listen_backlog: "64"
      listen_reuse_port: "0"
      listen_try: "0"
      mark_cache_size: "5368709120"
      max_concurrent_queries: "100"
      max_connections: "4096"
      max_open_files: "262144"
      max_partition_size_to_drop: "0"
      max_server_memory_usage_to_ram_ratio: "0.9"
      max_server_memory_usage: "0"
      max_session_timeout: "3600"
      max_table_size_to_drop: "0"
      max_thread_pool_size: "10000"
      mlock_executable: "true"
      mmap_cache_size: "1000"
      path_to_regions_hierarchy_file: /opt/geo/regions_hierarchy.txt
      path_to_regions_names_files: /opt/geo/
      remap_executable: "false"
      system_profile: default
      timezone: UTC
      total_memory_profiler_step: "4194304"
      total_memory_tracker_sample_probability: "0"
      ttl_only_drop_parts: "1"
      umask: "022"
      uncompressed_cache_size: "8589934592"

    logs:
      logger:
        console: 1

      query_log:
        database: system
        table: query_log
        partition_by: toYYYYMMDD(event_date)
        ttl: event_date + INTERVAL 30 DAY DELETE
        flush_interval_milliseconds: "7500"

      part_log:
        database: system
        table: part_log
        partition_by: toYYYYMMDD(event_date)
        ttl: event_date + INTERVAL 30 DAY DELETE
        flush_interval_milliseconds: "7500"

      metric_log:
        database: system
        table: metric_log
        flush_interval_milliseconds: "7500"
        collect_interval_milliseconds: "1000"

      query_thread_log:
        database: system
        table: query_thread_log
        partition_by: toYYYYMMDD(event_date)
        ttl: event_date + INTERVAL 30 DAY DELETE
        flush_interval_milliseconds: "7500"

      asynchronous_metric_log:
        database: system
        partition_by: toYYYYMMDD(event_date)
        flush_interval_milliseconds: "7000"

      zookeeper_log:
        database: system
        partition_by: toYYYYMMDD(event_date)
        flush_interval_milliseconds: "7000"

      trace_log:
        database: system
        table: trace_log
        partition_by: toYYYYMMDD(event_date)
        ttl: event_date + INTERVAL 30 DAY DELETE
        flush_interval_milliseconds: "7500"

      crash_log:
        database: system
        table: crash_log
        partition_by: toYYYYMMDD(event_date)
        ttl: event_date + INTERVAL 30 DAY DELETE
        flush_interval_milliseconds: "1000"

      send_crash_reports:
        enabled: false
        anonymize: false
        endpoint: https://6f33034cfe684dd7a3ab9875e57b1c8d@o388870.ingest.sentry.io/5226277

    macros: {}
      # override:
      #   replicaOverride: replica
      #   shardOverride: shard_repl
      # custom:
      #   cluster: clickhouse
      #   cluster_repl: clickhouse_repl

    compression:
      cases:
        - min_part_size: "10000000000"
          min_part_size_ratio: "0.01"
          method: "zstd"

    ##
    ## Contains settings that allow ClickHouse to interact with a ZooKeeper cluster.
    ## ClickHouse uses ZooKeeper for storing metadata of replicas when using replicated tables. If replicated tables are not used, this section of parameters can be omitted.
    # node — ZooKeeper endpoint. You can set multiple endpoints.
    # session_timeout — Maximum timeout for the client session in milliseconds.
    # root — The znode that is used as the root for znodes used by the ClickHouse server. Optional.
    # identity — User and password, that can be required by ZooKeeper to give access to requested znodes. Optional.

    zookeeperServers:
      enabled: false
      # session_timeout_ms: "30000"
      # operation_timeout_ms: "10000"
      # config:
      #   - index: ""
      #     host: ""
      #     port: ""

    clickhouseKeeper:
      podManagementPolicy: "Parallel"
      updateStrategy: "RollingUpdate"
      enabled: true
      image: "clickhouse/clickhouse-keeper"
      imageVersion: "22.8.1.2097-alpine"
      externalAccess:
        enabled: false
        # loadBalancerIP: 10.10.10.10
      replicas: 1 # must be 1,3,5,7, etc for quorum
      tcpPort: 2181 # default value
      raftPort: 9444 # default value
      resources:
        requests:
          cpu: 0.2
          memory: 200Mi
        limits:
          cpu: 0.5
          memory: 600Mi
      coordinationSettings:
        auto_forwarding: "true"
        dead_session_check_period_ms: "500"
        election_timeout_lower_bound_ms: "1000"
        election_timeout_upper_bound_ms: "2000"
        force_sync: "true"
        fresh_log_gap: "200"
        heart_beat_interval_ms: "500"
        max_requests_batch_size: "100"
        min_session_timeout_ms: "10000"
        operation_timeout_ms: "10000"
        quorum_reads: "false"
        raft_logs_level: "information"
        reserved_log_items: "100000"
        rotate_log_storage_interval: "100000"
        session_timeout_ms: "30000"
        shutdown_timeout: "5000"
        snapshot_distance: "100000"
        snapshots_to_keep: "3"
        stale_log_gap: "10000"
        startup_timeout: "30000"
      customLabels: {}
      # specailstorageClassName: ""
      podAntiAffinity:
        enable: false
      metrics:
        enabled: false
        port: 9141
        endpoint: /metrics
        serviceMonitor:
          enabled: false
          additionalLabels: {}
          prometheusSelector:
            service-monitor: "true"
          selector:
          namespace:
          interval:
          scrapeTimeout:
          relabelings:
          metricRelabelings:
          honorLabels:

    distributed_ddl:
      path: /clickhouse/task_queue/ddl
      profile: default
      pool_size: 1
      task_max_lifetime: 604800
      cleanup_delay_period: 60
      max_tasks_in_queue: 1000

    ## Configuration of clusters used by the Distributed table engine.
    ## The parameters host, port, and optionally user, password, secure, compression are specified for each server:
    # host – The address of the remote server.
    # port – The TCP port for messenger activity ('tcp_port' in the config, usually set to 9000).
    # user – Name of the user for connecting to a remote server. Access is configured in the users.xml file. For more information, see the section "Access rights".
    # password – The password for connecting to a remote server (not masked).
    # secure - Use ssl for connection, usually you also should define port = 9440. Server should listen on 9440 and have correct certificates.
    # compression - Use data compression. Default value: true.

    remoteServers:
      enabled: false
      # internalReplication: false
      # # clusterName: name # by default - {{ Release.Name }}
      replica:
      #   user: replica_tech
      #   password: some_password
      #   aclNetwork:
      #     - "0.0.0.0/0"
      #   compression: false
      #   ## Enable replica node on shard
        backup:
          enabled: false
      #     affinity:
      #       preset: "required"
