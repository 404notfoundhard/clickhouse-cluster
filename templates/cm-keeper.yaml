---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-keeper-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-keeper
    app.kubernetes.io/instance: {{ .Release.Name }}-keeper
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- $replicas := int .Values.clickhouseCluster.clickhouseKeeper.replicas }}
  keeper_config.xml: |-
    <yandex>
      <keeper_server>
        <tcp_port>2181</tcp_port>
        <server_id>__CHANGEME__</server_id>
        <log_storage_path>/var/lib/clickhouse/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/snapshots</snapshot_storage_path>

        <coordination_settings>
            <operation_timeout_ms>10000</operation_timeout_ms>
            <session_timeout_ms>30000</session_timeout_ms>
            <raft_logs_level>trace</raft_logs_level>
        </coordination_settings>

        <raft_configuration>
        {{- range untilStep 0 $replicas 1 }}
            <server>
                <id>{{ add . 1 }}</id>
                <hostname>{{ $.Chart.Name }}.{{ $.Chart.Name }}-keeper-{{ add . 1 }}.{{ $.Release.Namespace }}.svc.k8s</hostname>
                <port>9444</port>
            </server>
        {{- end }}
        </raft_configuration>
      </keeper_server>
    </yandex>
