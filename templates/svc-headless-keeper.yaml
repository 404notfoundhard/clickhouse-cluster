---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-headless-keeper
  labels:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-keeper
    app.kubernetes.io/instance: {{ .Release.Name }}-keeper
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: True
  ports:
  - port: 9444
    targetPort: tcp-port-int
    protocol: TCP
    name: tcp-port-int
  selector:
    app.kubernetes.io/name: {{ include "clickhouse.name" . }}-keeper
    app.kubernetes.io/instance: {{ .Release.Name }}-keeper
